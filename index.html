<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Site | Home</title>
    <style>
        /* Shared Styles for All Pages */
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --light: #ecf0f1;
            --text: #333;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--text); line-height: 1.6; }
        
        /* Navigation Bar */
        nav {
            background: var(--primary);
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 15px;
            border-radius: 4px;
        }

        nav a:hover { background: var(--accent); }
        nav a.active { border-bottom: 2px solid var(--accent); }

        .container { max-width: 900px; margin: 2rem auto; padding: 0 20px; }
        header { text-align: center; padding: 50px 0; background: var(--light); }
        footer { text-align: center; margin-top: 50px; padding: 20px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>

    <header>
        <h1>Welcome to My Website</h1>
        <p>This is the Home tab. Built for GitHub Pages.</p>
    </header>

    <div class="container">
        <h2>Latest Updates</h2>
        <p>I am building this site to showcase my multi-page navigation skills. Each link in the menu above leads to a different HTML file in my repository.</p>
    </div>

    <footer>&copy; 2026 My GitHub Site</footer>

</body>
</html>
